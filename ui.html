<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEUTRA OSINT 2.0</title>
<style>
  :root{--bg:#0a0e14;--panel:#111820;--line:#1f2a36;--text:#c8d6e5;--dim:#5a6d7e;
        --accent:#00d4aa;--warn:#ffb347;--bad:#ff5c5c;--ok:#4ade80;
        --mono:'SF Mono',Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;min-height:100vh}
  header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px}
  h1{font-size:16px;font-weight:600;letter-spacing:1px}
  h1 span{color:var(--accent)}
  .badge{background:var(--line);color:var(--dim);padding:2px 8px;border-radius:4px;font-size:11px}
  main{max-width:980px;margin:0 auto;padding:24px 20px}
  .row{display:flex;gap:10px;margin-bottom:20px}
  input,button{font-family:var(--mono);font-size:14px;border:1px solid var(--line);
               background:var(--panel);color:var(--text);padding:12px;border-radius:6px}
  input{flex:1}
  input:focus{outline:none;border-color:var(--accent)}
  button{cursor:pointer;background:var(--accent);color:#04120e;font-weight:600;border:none;padding:12px 20px}
  button:hover{opacity:.9}
  .hint{color:var(--dim);font-size:12px;margin-bottom:20px}
  .hint a{color:var(--accent);text-decoration:none;margin-left:8px}
  .hint a:hover{text-decoration:underline}
  .mods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .mod{border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;
       background:var(--panel);transition:.15s;min-width:180px}
  .mod:hover{border-color:var(--accent)}
  .mod b{display:block;font-size:13px;margin-bottom:2px}
  .mod small{color:var(--dim);font-size:11px;line-height:1.3;display:block}
  .panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);
         padding:16px;margin-bottom:16px;display:none}
  .panel.show{display:block}
  .panel h2{font-size:13px;color:var(--accent);margin-bottom:12px;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse}
  td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;
     font-size:13px;word-break:break-all}
  td:first-child{color:var(--dim);width:34%;padding-right:12px}
  .status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
  .status.ok{background:#0d201c;color:var(--ok)}
  .status.warn{background:#241d0d;color:var(--warn)}
  .status.bad{background:#240d0d;color:var(--bad)}
  #terminal{background:#05080c;border:1px solid var(--line);border-radius:8px;padding:14px;
            height:260px;overflow-y:auto;font-size:12px;line-height:1.6;margin-bottom:16px}
  #terminal.hidden{display:none}
  #terminal .line{white-space:pre-wrap}
  #terminal .ts{color:var(--dim)}
  #terminal .ok{color:var(--ok)}
  #terminal .warn{color:var(--warn)}
  #terminal .bad{color:var(--bad)}
  #terminal .info{color:var(--accent)}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bar label{color:var(--dim);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
  footer{border-top:1px solid var(--line);padding:20px;text-align:center;color:var(--dim);
         font-size:12px;margin-top:40px}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .credits{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>NEUTRA <span>OSINT</span> 2.0</h1>
  <span class="badge">ethical · public · local</span>
</header>

<main>
  <div class="row">
    <input id="q" placeholder="Enter an email, username, phone, IP, domain, URL, CVE, hash, ASN, or coords…" autofocus>
    <button id="go">Scan</button>
  </div>
  <div class="hint">
    Examples:
    <a href="#" data-ex="@lilprince">@lilprince</a>
    <a href="#" data-ex="user@example.com">user@example.com</a>
    <a href="#" data-ex="+14155552671">+14155552671</a>
    <a href="#" data-ex="8.8.8.8">8.8.8.8</a>
    <a href="#" data-ex="example.com">example.com</a>
    <a href="#" data-ex="CVE-2024-3094">CVE-2024-3094</a>
  </div>

  <div class="bar">
    <label><input type="checkbox" id="live" checked> Live command feed</label>
    <label><input type="checkbox" id="auto" checked> Auto-run all applicable pullers</label>
    <span id="status" style="margin-left:auto;color:var(--dim);font-size:12px"></span>
  </div>

  <div id="terminal">
    <div class="line"><span class="ts">[ready]</span> <span class="info">NEUTRA 2.0 initialised</span></div>
  </div>

  <div class="mods" id="mods"></div>
  <div id="out"></div>
</main>

<footer>
  <div class="credits">
    <span>Built by <a href="https://neutraco.vercel.app/" target="_blank">NEUTRA</a> ·
          <a href="https://guns.lol/lilprince" target="_blank">LittllePrince</a></span>
    <span>Powered by <a href="https://osintframework.com/" target="_blank">OSINT Framework</a></span>
  </div>
  <div>Use only on your own accounts or with explicit permission. Public data only.</div>
</footer>

<script>
const $ = s => document.querySelector(s);
const qEl = $('#q'), modsEl = $('#mods'), outEl = $('#out'), termEl = $('#terminal');
let busy = false;

function esc(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function log(msg, cls) {
  if (!$('#live').checked) return;
  const t = new Date().toTimeString().slice(0,8);
  const d = document.createElement('div');
  d.className = 'line';
  d.innerHTML = '<span class="ts">[' + t + ']</span> <span class="' + (cls||'') + '">'
              + esc(msg) + '</span>';
  termEl.appendChild(d);
  termEl.scrollTop = termEl.scrollHeight;
}

async function detect() {
  const q = qEl.value.trim();
  if (!q) return;
  modsEl.innerHTML = '';
  outEl.innerHTML = '';
  log('detecting input type…', 'info');
  try {
    const r = await fetch('/api/detect?q=' + encodeURIComponent(q));
    const j = await r.json();
    if (!j.mods.length) {
      modsEl.innerHTML = '<span style="color:var(--dim)">No pullers apply to this input.</span>';
      log('no pullers available for this input', 'warn');
      return;
    }
    log('type = ' + j.type + ' · ' + j.mods.length + ' pullers available', 'ok');
    j.mods.forEach(m => {
      const d = document.createElement('div');
      d.className = 'mod';
      d.innerHTML = '<b>' + esc(m.label) + '</b><small>' + esc(m.why) + '</small>';
      d.onclick = () => run(m.id, m.label);
      modsEl.appendChild(d);
    });
    if ($('#auto').checked) {
      for (const m of j.mods) await run(m.id, m.label);
    }
  } catch (e) {
    log('detect error: ' + e.message, 'bad');
  }
}

async function run(id, label) {
  if (busy) return;
  busy = true;
  $('#status').textContent = 'running ' + label + '…';
  log('→ ' + label, 'info');
  const t0 = performance.now();
  try {
    const r = await fetch('/api/run?m=' + id + '&q=' + encodeURIComponent(qEl.value.trim()));
    const j = await r.json();
    const ms = Math.round(performance.now() - t0);
    if (!j.ok) {
      log('✗ ' + label + ' failed: ' + j.error, 'bad');
    } else {
      const cls = j.status === 'ok' ? 'ok' : j.status === 'warn' ? 'warn' : 'bad';
      log('✓ ' + label + ' (' + ms + 'ms)', cls);
      render(id, label, j);
    }
  } catch (e) {
    log('✗ ' + label + ' error: ' + e.message, 'bad');
  }
  busy = false;
  $('#status').textContent = '';
}

function render(id, label, j) {
  const old = document.getElementById('p-' + id);
  if (old) old.remove();
  const p = document.createElement('div');
  p.className = 'panel show';
  p.id = 'p-' + id;
  let html = '<h2>' + esc(label) + ' <span class="status ' + j.status + '">'
           + j.status + '</span></h2><table>';
  (j.rows || []).forEach(row => {
    const k = row[0], v = row[1];
    if (k === '') html += '<tr><td></td><td>' + esc(v) + '</td></tr>';
    else html += '<tr><td>' + esc(k) + '</td><td>' + esc(v) + '</td></tr>';
  });
  html += '</table>';
  p.innerHTML = html;
  outEl.appendChild(p);
}

$('#go').onclick = detect;
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') detect(); });
document.querySelectorAll('.hint a').forEach(a => {
  a.onclick = ev => { ev.preventDefault(); qEl.value = a.dataset.ex; detect(); };
});
$('#live').onchange = e => termEl.classList.toggle('hidden', !e.target.checked);
</script>
</body>
</html>
